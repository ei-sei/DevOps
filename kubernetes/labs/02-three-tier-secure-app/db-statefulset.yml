apiVersion: v1
kind: Service
metadata:
  name: db-service
spec:
  clusterIP: None   # headless - gives each pod its own DNS name instead of load-balancing across them
  selector:
    app: db          # routes to any pod with this label - same as a normal Service
  ports:
    - port: 27017
---
apiVersion: apps/v1
kind: StatefulSet   # not Deployment - gives each pod stable identity + its own storage
metadata:
  name: db
spec:
  serviceName: db-service   # must match the headless Service defined above
  replicas: 1
  selector:
    matchLabels:
      app: db   # must match template.metadata.labels below - how the StatefulSet finds its own pods
  template:               # the pod template - what each replica actually runs
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: mongodb
          image: mongo:5.0
          volumeMounts:                # mounts a volume into the container's filesystem
            - name: db-storage         # must match the volumeClaimTemplate name below
              mountPath: /data/db      # where MongoDB actually writes its data
  volumeClaimTemplates:     # auto-generates one PVC per replica (db-storage-db-0, db-storage-db-1, ...)
    - metadata:
        name: db-storage
      spec:
        accessModes: ["ReadWriteOnce"]   # one node can mount it read-write
        resources:
          requests:
            storage: 1Gi
