name: manual workflow

on:
  push:
    branches: [ github-actions ]
  # Adds a manual trigger button in the Actions tab with a dropdown to select Python version
  workflow_dispatch:
    inputs:
      python-version:
        description: "Choose Python version"
        required: true
        default: "3.8"
        type: choice
        options:
          - "3.8"
          - "3.9"
          - "3.10"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [ "${{ github.event.inputs.python-version }}" ] 
        # Wraps the input in a matrix so steps reference matrix.python-version consistently

    steps:

      - name: checkout code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v4
        with:
          python-version: ${{matrix.python-version}}

      - name: install dependencies
        run: |
          cd workflow-examples/02-matrix 
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: run tests
        run: |
          cd workflow-examples/02-matrix 
          python -m unittest discover

      - name: notify success
        run: echo "Tests passed on Python ${{matrix.python-version}}"
        if: success()
